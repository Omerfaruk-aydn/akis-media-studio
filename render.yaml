services:
  - type: web
    name: akis-media-studio
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: HOST
        value: 0.0.0.0
      - key: ALLOWED_ORIGINS
        value: https://akis-media-studio.vercel.app
    autoDeploy: true
